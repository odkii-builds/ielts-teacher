<style>
html{background:#fafaf9}@media(prefers-color-scheme:dark){html{background:#0b0b0d}}
#boot{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:26px;background:#fafaf9;transition:opacity .45s cubic-bezier(.32,.72,0,1),transform .45s cubic-bezier(.32,.72,0,1)}
#boot.out{opacity:0;transform:scale(1.05);pointer-events:none}
#boot img{width:96px;height:96px;display:block;animation:bin .6s cubic-bezier(.32,.72,0,1) both,bp 1.8s ease-in-out .6s infinite}
#boot i{display:flex;gap:7px}#boot i b{width:7px;height:7px;border-radius:50%;background:#0045fd;opacity:.25;animation:bd 1.1s ease-in-out infinite}
#boot i b:nth-child(2){animation-delay:.16s}#boot i b:nth-child(3){animation-delay:.32s}
@keyframes bin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes bp{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(30,110,255,0))}50%{transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(30,110,255,.5))}}
@keyframes bd{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@media(prefers-color-scheme:dark){#boot{background:#0b0b0d}#boot i b{background:#4f86ff}}
@media(prefers-reduced-motion:reduce){#boot,#boot *{animation:none!important;transition:opacity .2s!important}#boot.out{transform:none}}
</style>
